# La carte vivante (serveur et site), en service permanent (serveur maison).
#
#   docker compose up -d --build      installer ou mettre à jour
#   docker compose logs -f            suivre les journaux
#
# Réglages dans un fichier .env à côté de ce fichier (jamais versionné ; modèle : .env.example, détail : docs/deploiement.md), par exemple :
#   BIND_ADDRESS=192.168.0.75          adresse d'écoute sur la machine (127.0.0.1 par défaut : la machine seule)
#   ARCHIVE_PATH=/mnt/pool/carte-vivante   où garder les archives du temps réel
#   RUN_AS=1000:1000                   utilisateur:groupe propriétaire des dossiers data et archive
#   AISSTREAM_API_KEY=…                clé aisstream.io de la couche « Bateaux » (secrète : chmod 600 .env)
#   ATMO_USERNAME=… ATMO_PASSWORD=…    compte Atmo Data de la couche « Qualité de l'air » (secrets)
#   IDFM_PRIM_API_KEY='…'              clé PRIM d'Île-de-France Mobilités (transports d'Île-de-France ; secrète, entre apostrophes)

name: carte-vivante

services:
  serveur:
    # Contexte : la racine du dépôt (le site et le serveur sont construits ensemble).
    build:
      context: .
      dockerfile: server/Dockerfile
    image: carte-vivante-serveur
    restart: unless-stopped
    user: "${RUN_AS:-1000:1000}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    environment:
      # Vide = couche « Bateaux » désactivée. La clé ne sort jamais du serveur.
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      # Vides = couche « Qualité de l'air » désactivée. Compte Atmo Data : il ne sort jamais du serveur.
      ATMO_USERNAME: "${ATMO_USERNAME:-}"
      ATMO_PASSWORD: "${ATMO_PASSWORD:-}"
      # Vide = métro, RER, Transilien et tramways d'Île-de-France ignorés. Clé PRIM d'Île-de-France Mobilités : elle ne sort jamais du serveur.
      IDFM_PRIM_API_KEY: "${IDFM_PRIM_API_KEY:-}"
      # Facultatifs : modes (« metro,tram,train,cable » par défaut ; ajouter « bus » demande +80 Mo en permanence et +175 Mo de pic : voir docs/couches.md, pas avec 1 Go), intervalle du relevé en secondes (180), budget de mémoire en Mo (100).
      IDFM_MODES: "${IDFM_MODES:-}"
      IDFM_INTERVALLE_S: "${IDFM_INTERVALLE_S:-}"
      IDFM_MEMOIRE_MO: "${IDFM_MEMOIRE_MO:-}"
    volumes:
      - "${DATA_PATH:-./data}:/data"
      - "${ARCHIVE_PATH:-./archive}:/archive"
    # Isolation : système de fichiers en lecture seule, aucun privilège, mémoire et processeur bornés.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
