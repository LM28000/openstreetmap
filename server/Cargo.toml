[package]
name = "carte-vivante-serveur"
version = "0.1.0"
edition = "2024"
publish = false
description = "Serveur de Vigie : horaires et temps réel des trains SNCF"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
# Base nationale des bornes de recharge (CSV de 130 Mo, lu en continu).
csv = "1.4.0"
flate2 = "1.1.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
image-webp = "0.2.4"
gtfs-structures = { version = "0.52.0", default-features = false }
jiff = { version = "0.2.41", features = ["tzdb-bundle-always"] }
prost = "0.14.4"
reqwest = "0.13.5"
# Flux DATEX II du trafic routier (XML).
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "net"] }
# Flux AIS des navires (WebSocket), en TLS rustls comme reqwest.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Lecture en flux des GTFS des réseaux (mêmes versions et fonctionnalités que gtfs-structures, déjà compilé).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.22.2", default-features = false }
# Cartes de couverture mobile de l'ARCEP : des GeoPackage (des bases SQLite). SQLite est compilée avec le serveur.
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
lto = "thin"
