[package]
name = "carte-vivante-serveur"
version = "0.1.0"
edition = "2024"
publish = false
description = "Serveur de la carte vivante : horaires et temps réel des trains SNCF"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
flate2 = "1.1.11"
gtfs-structures = { version = "0.52.0", default-features = false }
jiff = { version = "0.2.41", features = ["tzdb-bundle-always"] }
prost = "0.14.4"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "net"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
